[project]
name = "dataclinic-mcp"
version = "0.1.0"
description = "MCP server for exploratory data analysis — profile, diagnose, clean and export datasets from files or databases"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Muhammad Hammad Farooque" }]
keywords = ["mcp", "eda", "data-analysis", "pandas", "data-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "mcp[cli]>=2.1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
parquet = ["pyarrow>=15.0"]
plots = ["matplotlib>=3.8"]
postgres = ["sqlalchemy>=2.0", "sqlglot>=25.0", "psycopg[binary]>=3.1"]
mysql = ["sqlalchemy>=2.0", "sqlglot>=25.0", "pymysql>=1.1"]
mssql = ["sqlalchemy>=2.0", "sqlglot>=25.0", "pyodbc>=5.1"]
duckdb = ["sqlalchemy>=2.0", "sqlglot>=25.0", "duckdb>=1.0"]
sql = ["sqlalchemy>=2.0", "sqlglot>=25.0"]
all = [
    "openpyxl>=3.1",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "sqlalchemy>=2.0",
    "sqlglot>=25.0",
    "psycopg[binary]>=3.1",
    "pymysql>=1.1",
    "duckdb>=1.0",
]

[project.scripts]
dataclinic-mcp = "eda_mcp:main"

[project.urls]
Homepage = "https://github.com/Muhammad-hammad-farooque/DataClinic-mcp"
Repository = "https://github.com/Muhammad-hammad-farooque/DataClinic-mcp"
Issues = "https://github.com/Muhammad-hammad-farooque/DataClinic-mcp/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "sqlglot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live database",
    "slow: long-running benchmark",
]
