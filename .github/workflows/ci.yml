# Checks from spec section 16.6. The bench job arrives with phase 6.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra sql --extra duckdb
      - run: uv run mypy src

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing combination should not hide the state of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra sql --extra duckdb
      - run: uv run pytest -m "not integration and not slow"

  postgres:
    # The database tools against a real server: read-only sessions,
    # statement_timeout, PERCENTILE_CONT, TABLESAMPLE ... REPEATABLE.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password  # a throwaway container, not a secret
          POSTGRES_DB: eda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EDA_TEST_POSTGRES_DSN: postgresql://postgres:ci-only-password@localhost:5432/eda
      EDA_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra sql --extra postgres
      - run: uv run pytest -m integration -rs tests/integration

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv export --locked --all-extras --no-hashes --no-emit-project -o requirements.txt
      - run: uvx pip-audit --strict -r requirements.txt
      - run: uvx ruff check --select S src
